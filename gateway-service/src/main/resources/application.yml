server:
  port: 8585
  forward-headers-strategy: framework
spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        provider:
          keycloak:
           issuer-uri: http://localhost:9090/realms/ecommerce
        registration:
          ecommerce-postman:
            provider: keycloak
            client-id: ecommerce-postman
            authorization-grant-type: authorization_code
            scope:
              - openid
              - email
              - profile
            redirect-uri: http://localhost:8585/login/oauth2/code/ecommerce-postman

  cloud:
    gateway:

      server:
        webflux:
          trusted-proxies: ".*"
          discovery:
            locator:
              enabled: true # Should Gateway automatically create routes for every service registered in Eureka?
              lowerCaseServiceId: true # How the service ID is converted into a route path when discovery locator is enabled.
          routes:
#          - id: vue.js
#            uri: http://[::1]:5173
#            predicates:
#              - Path=/**

          default-filters:
            - TokenRelay=

    nacos:
      config:
        file-extension: yaml
        namespace: ${spring.profiles.active}
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: 6090
        namespace: ${spring.profiles.active}

management.endpoints.web.exposure.include: "health,info,gateway"
management:
  endpoint:
    auditevents:
      access: read_only

springdoc:
  swagger-ui:
    urls:
#      - name: Order Service
#        url: /order-service/v3/api-docs
#      - name: Customer Service
#        url: /customer-service/v3/api-docs
      - name: User Service
        url: /users-service/v3/api-docs
