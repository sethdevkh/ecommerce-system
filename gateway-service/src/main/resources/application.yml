server:
  port: 8585
spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  cloud:
    gateway:
      server:
        webflux:
          trusted-proxies: ".*"
          discovery:
            locator:
              enabled: false # Should Gateway automatically create routes for every service registered in Eureka?
              lowerCaseServiceId: true # How the service ID is converted into a route path when discovery locator is enabled.
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order-service/**
              filters:
                - RewritePath=/order-service/?(?<segment>.*), /$\{segment}
            - id: business-service
              uri: lb://business-service
              predicates:
                - Path=/business-service/**
              filters:
                - RewritePath=/business-service/?(?<segment>.*), /$\{segment}

    nacos:
      config:
        file-extension: yaml
        namespace: ${spring.profiles.active}
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: 6090
        namespace: ${spring.profiles.active}

management.endpoints.web.exposure.include: "health,info,gateway"
management:
  endpoint:
    auditevents:
      access: read_only

springdoc:
#  api-docs:
#    enabled: false
  swagger-ui:
    urls:
      - name: Order Service
        url: /v3/api-docs
      - name: Business Service
        url: /v3/api-docs