server:
  port: 0
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/db_order
    username: ecom_user
    password: ecom_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
  profiles:
    active:
      - dev
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: 6090