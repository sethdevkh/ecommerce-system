server:
  port: 8554
  forward-headers-strategy: framework

spring:
  application:
    name: users-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/db_user
    username: ecom_user
    password: ecom_password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    #    nacos:
    #      config:
    #        file-extension: yml
    #        namespace: ${spring.profiles.active}
    #      discovery:
    #        server-addr: localhost:8848
    #        username: nacos
    #        password: 6090
    #        namespace: ${spring.profiles.active}
    nacos:
      config:
        file-extension: yaml
        namespace: ${spring.profiles.active}
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: 6090
        namespace: ${spring.profiles.active}
