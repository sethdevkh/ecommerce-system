services:
  db:
    image: postgres:16-alpine
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount initialization scripts
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce-net

  nacos:
    image: nacos/nacos-server
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
    volumes:
      - nacos_data:/home/nacos/data
      - ./standalone-logs/:/home/nacos/logs
    ports:
      - "8080:8080" # Console
      - "8848:8848" # Server
      - "9848:9848" # gRPC

  postgres:
    image: postgres:16
    container_name: keycloak_db
    environment:
      POSTGRES_DB: kc_db
      POSTGRES_USER: useradmin
      POSTGRES_PASSWORD: userpass
    volumes:
      - postgres_kc_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak_app
    command: start-dev # Use 'start' for absolute production with TLS/SSL configs
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/kc_db
      KC_DB_USERNAME: useradmin
      KC_DB_PASSWORD: userpass
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "9090:8080"

volumes:
  postgres_data:
  postgres_kc_data:
  nacos_data:

# docker network create ecommerce-net
networks:
  ecommerce-net:
    external: true
